<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>isSlop promo 440×280</title>
  <style>
    @font-face {
      font-family: Manrope;
      src: url("../fonts/manrope-var.woff2") format("woff2");
      font-weight: 400 800;
    }
    html, body {
      margin: 0;
      width: 440px;
      height: 280px;
      overflow: hidden;
      background: #1c1c1c;
      color: #ededea;
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
    }
    .tile {
      width: 440px;
      height: 280px;
      box-sizing: border-box;
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(120deg, rgba(255, 106, 0, 0.16), transparent 42%),
        #1c1c1c;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #ff7a1a;
      color: #fff;
      display: grid;
      place-items: center;
    }
    .logo svg { width: 20px; height: 20px; }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
      color: #c9c9c4;
      max-width: 16em;
    }
    .kicker {
      font: 700 11px/1 "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: 0.14em;
      color: #ffb27a;
    }
  </style>
</head>
<body>
  <div class="tile">
    <div>
      <p class="kicker">100% LOCAL</p>
      <div class="brand" style="margin-top: 14px">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 11-6 6v3h9l3-3" />
            <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" />
          </svg>
        </span>
        <h1>isSlop</h1>
      </div>
    </div>
    <p>Highlight likely AI slop on any page. Nothing leaves the browser.</p>
  </div>
</body>
</html>
