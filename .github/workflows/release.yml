name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $ver"
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(node -p "require('./manifest.json').version")
          gh release create "$GITHUB_REF_NAME" \
            "dist/islop-${ver}.zip" \
            --title "isSlop ${ver}" \
            --generate-notes
